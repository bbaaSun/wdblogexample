<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Flush mount and downrod mounting</title><desc id="desc">Two schematic side views. A flush mount holds a fan close to the ceiling; a downrod lowers the fan. In both cases measure from the blades to the floor and check the fixture's lowest point separately.</desc><rect width="800" height="390" fill="#f0f1e8"/><g font-family="Arial,sans-serif" fill="#242521" text-anchor="middle"><text x="200" y="38" font-size="23" font-weight="bold">Flush mount</text><text x="600" y="38" font-size="23" font-weight="bold">Downrod mount</text><g stroke="#5e625b" stroke-width="4"><path d="M35 72H365M435 72H765M35 335H365M435 335H765"/><path d="M200 77V107M600 77V164" stroke-width="11"/><path d="M103 118H297M503 177H697" stroke-width="9"/><path d="M178 121V145H222V121M578 180V204H622V180" stroke-width="3" fill="#dadbd2"/></g><g stroke="#a93819" stroke-width="2" fill="none"><path d="M87 122V330M81 128L87 121L93 128M81 323L87 331L93 323M487 181V330M481 187L487 180L493 187M481 323L487 331L493 323"/></g><text x="208" y="251" font-size="22">Blade-to-floor</text><text x="208" y="279" font-size="22">height</text><text x="608" y="251" font-size="22">Blade-to-floor</text><text x="608" y="279" font-size="22">height</text><text x="200" y="368" font-size="18">Floor</text><text x="600" y="368" font-size="18">Floor</text></g></svg>